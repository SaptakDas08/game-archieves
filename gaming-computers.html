<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Personal Computer — Game Archieves</title>
    <meta name="description" content="Browse PC games for Windows, Linux and macOS with screenshots, operating-system support, hardware requirements and any files attached to an entry." />
  </head>
  <body>
    <header class="site-header" data-site-header></header>

    <main id="main" class="wrap">
      <section class="page-head">
        <p class="eyebrow">Game Archieves</p>
        <h1>Personal Computer</h1>
        <p class="muted">Check PC game details, screenshots, operating-system support, and hardware requirements before you play.</p>
      </section>

      <section aria-labelledby="catalogue">
        <h2 id="catalogue" class="sr-only">Catalogue</h2>
        <div class="toolbar">
          <div class="field">
            <label for="search">Search games</label>
            <input id="search" type="search" placeholder="Search by title, genre or platform" data-search />
          </div>
          <div class="field">
            <label for="sort">Sort</label>
            <select id="sort" data-sort>
              <option value="default">Catalogue order</option>
              <option value="az">Title A–Z</option>
            </select>
          </div>
          <button class="btn btn-ghost" type="button" data-reset hidden>Clear filters</button>
        </div>

        <div class="chip-bar" role="radiogroup" aria-label="Filter by operating system" data-chips></div>
        <p class="result-status" role="status" data-result-status></p>
        <div class="grid" data-grid></div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="/src/pc-page.js"></script>
  </body>
</html>
