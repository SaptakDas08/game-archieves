<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Emulators — Game Archieves</title>
    <meta name="description" content="Browse homebrew and officially re-released games you can run in an emulator, linked only to the author or rights holder's own download." />
  </head>
  <body>
    <header class="site-header" data-site-header></header>

    <main id="main" class="wrap">
      <section class="page-head">
        <p class="eyebrow">Game Archieves</p>
        <h1>Emulators</h1>
        <p class="muted">Games you run in an emulator — homebrew released by its author, and official re-releases. Every ROM link goes to the rights holder's own download; no dumps, BIOS, firmware or keys are listed here, and the emulator itself is yours to obtain.</p>
      </section>

      <section aria-labelledby="catalogue">
        <h2 id="catalogue" class="sr-only">Catalogue</h2>
        <div class="toolbar">
          <div class="field">
            <label for="search">Search games</label>
            <input id="search" type="search" placeholder="Search by title, genre or system" data-search />
          </div>
          <div class="field">
            <label for="sort">Sort</label>
            <select id="sort" data-sort>
              <option value="default">Catalogue order</option>
              <option value="az">Title A–Z</option>
            </select>
          </div>
          <button class="btn btn-ghost" type="button" data-reset hidden>Clear filters</button>
        </div>

        <div class="chip-bar" role="radiogroup" aria-label="Filter by entry type" data-chips></div>
        <p class="result-status" role="status" data-result-status></p>
        <div class="grid" data-grid></div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="/src/emulator-page.js"></script>
  </body>
</html>
